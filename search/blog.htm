<!--{template common/header}-->
<mdui-top-app-bar><mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon><mdui-top-app-bar-title>{lang search}</mdui-top-app-bar-title></mdui-top-app-bar>
<div style="padding:1rem 1rem 5.5rem">
	<form method="post" autocomplete="off" action="search.php?mod=blog"><input type="hidden" name="formhash" value="{FORMHASH}"><!--{subtemplate search/pubsearch}--></form>
	<!--{if !empty($searchid) && submitcheck('searchsubmit', 1)}-->
	<mdui-list style="margin-top:1rem"><mdui-list-subheader>{lang search_result}</mdui-list-subheader><!--{if empty($bloglist)}--><mdui-list-item>{lang search_nomatch}</mdui-list-item><!--{else}--><!--{loop $bloglist $blog}--><mdui-list-item href="home.php?mod=space&uid={$blog['uid']}&do=blog&id={$blog['blogid']}" rounded>{$blog['subject']}<span slot="description">{$blog['username']} · {$blog['dateline']} · {lang views} {$blog['viewnum']} · {lang replies} {$blog['replynum']}</span></mdui-list-item><!--{/loop}--><!--{/if}--></mdui-list><!--{if $multipage}--><div style="margin-top:1rem">$multipage</div><!--{/if}-->
	<!--{/if}-->
</div>
<!--{template common/footer}-->
