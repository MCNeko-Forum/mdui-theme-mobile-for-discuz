<!--{template common/header}-->
<mdui-top-app-bar>
	<mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon>
	<mdui-top-app-bar-title>{$curtype['name']}</mdui-top-app-bar-title>
	<div style="flex-grow:1"></div>
	<mdui-button-icon icon="add" href="forum.php?mod=group&action=create" title="{lang group_create}"></mdui-button-icon>
</mdui-top-app-bar>

<div style="padding:0 0 88px">
	<!--{if $typelist}-->
	<mdui-chip-set style="padding:.5rem .75rem;overflow-x:auto;white-space:nowrap">
		<!--{loop $typelist $fid $type}--><mdui-chip href="group.php?sgid={$fid}"{if $sgid == $fid} selected{/if}>{$type['name']}</mdui-chip><!--{/loop}-->
	</mdui-chip-set>
	<!--{/if}-->
	<!--{if $list}-->
	<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;padding:.25rem .75rem">
		<!--{loop $list $fid $group}-->
		<mdui-card variant="filled" href="forum.php?mod=group&fid={$group['fid']}" style="display:block;padding:1rem;min-width:0">
			<!--{if $group['icon'] && !strstr($group['icon'], 'groupicon.gif')}--><mdui-avatar src="{$group['icon']}" style="width:3rem;height:3rem"></mdui-avatar><!--{else}--><mdui-icon name="groups" style="font-size:3rem;color:rgb(var(--mdui-color-primary))"></mdui-icon><!--{/if}-->
			<div style="font-weight:600;margin-top:.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{$group['name']}</div>
			<div style="font-size:.75rem;opacity:.68;margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"><!--{if $group['description']}-->{$group['description']}<!--{else}-->{$group['threads']} {lang threads}<!--{/if}--></div>
		</mdui-card>
		<!--{/loop}-->
	</div>
	<!--{if $multipage}--><div style="padding:1rem">{$multipage}</div><!--{/if}-->
	<!--{else}--><div style="padding:3rem 1rem;text-align:center;opacity:.6">{lang group_category_no_groups}</div><!--{/if}-->
</div>
<!--{template common/footer}-->
