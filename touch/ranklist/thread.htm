<!--{template common/header}--><mdui-top-app-bar><mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon><mdui-top-app-bar-title>{lang ranklist_thread}</mdui-top-app-bar-title></mdui-top-app-bar><!--{subtemplate ranklist/side_top}--><div class="mdui-rank-page"><div class="mdui-rank-tabs"><mdui-tabs value="$_GET['view']"><mdui-tab value="replies" data-href="misc.php?mod=ranklist&type=thread&view=replies&orderby=$orderby">{lang ranklist_reply}</mdui-tab><mdui-tab value="views" data-href="misc.php?mod=ranklist&type=thread&view=views&orderby=$orderby">{lang visit_ranklist}</mdui-tab><mdui-tab value="sharetimes" data-href="misc.php?mod=ranklist&type=thread&view=sharetimes&orderby=$orderby">{lang ranklist_share}</mdui-tab><mdui-tab value="favtimes" data-href="misc.php?mod=ranklist&type=thread&view=favtimes&orderby=$orderby">{lang ranklist_favorite}</mdui-tab><mdui-tab value="heats" data-href="misc.php?mod=ranklist&type=thread&view=heats&orderby=$orderby">{lang ranklist_hot}</mdui-tab></mdui-tabs></div><!--{template ranklist/period}--><!--{if $threadlist}--><div class="mdui-rank-list"><!--{loop $threadlist $thread}--><mdui-card variant="filled"><a class="mdui-rank-item" href="forum.php?mod=viewthread&tid=$thread['tid']"><span class="mdui-rank-no<!--{if $thread['rank'] <= 3}--> mdui-rank-no-top<!--{/if}-->">$thread['rank']</span><div class="mdui-rank-body"><div class="mdui-rank-title">$thread['subject']</div><div class="mdui-rank-meta">$thread['author'] · $thread['dateline']</div></div></a></mdui-card><!--{/loop}--></div><!--{else}--><div class="mdui-rank-empty">{lang none_data}</div><!--{/if}--><div class="mdui-rank-empty">{lang ranklist_update}</div></div><!--{template common/footer}-->
