	var seccheck_tpl = seccheck_tpl || {};

	function updateseccode(idhash, tpl, modid) {
		if(!document.getElementById('seccode_' + idhash)) return;
		if(tpl) seccheck_tpl[idhash] = tpl;
		if(modid) seccheck_modid[idhash] = modid;
		else modid = seccheck_modid[idhash];
		var id = 'seccodejs_' + idhash;
		if(document.getElementById(id)) document.getElementsByTagName('head')[0].removeChild(document.getElementById(id));
		var scriptNode = document.createElement('script');
		scriptNode.type = 'text/javascript';
		scriptNode.id = id;
		scriptNode.src = 'misc.php?mod=seccode&action=update&idhash=' + idhash + '&' + Math.random() + '&modid=' + modid;
		document.getElementsByTagName('head')[0].appendChild(scriptNode);
	}
