	<script type="text/javascript">
	var seccheck_tpl = seccheck_tpl || {};
	var seccheck_modid = seccheck_modid || {};
	function updateseccode(idhash, tpl, modid) {
		if(!document.getElementById('seccode_' + idhash)) return;
		if(tpl) seccheck_tpl[idhash] = tpl;
		if(modid) seccheck_modid[idhash] = modid;
		else modid = seccheck_modid[idhash];
		var id = 'seccodejs_' + idhash;
		if(document.getElementById(id)) document.getElementsByTagName('head')[0].removeChild(document.getElementById(id));
		var scriptNode = document.createElement('script');
		scriptNode.type = 'text/javascript';
		scriptNode.id = id;
		scriptNode.src = 'misc.php?mod=seccode&action=update&mobile=2&idhash=' + idhash + '&' + Math.random() + '&modid=' + modid;
		document.getElementsByTagName('head')[0].appendChild(scriptNode);
	}
	function updatesecqaa(idhash, tpl, modid) {
		if(!document.getElementById('secqaa_' + idhash)) return;
		if(tpl) seccheck_tpl[idhash] = tpl;
		if(modid) seccheck_modid[idhash] = modid;
		else modid = seccheck_modid[idhash];
		var id = 'secqaajs_' + idhash;
		if(document.getElementById(id)) document.getElementsByTagName('head')[0].removeChild(document.getElementById(id));
		var scriptNode = document.createElement('script');
		scriptNode.type = 'text/javascript';
		scriptNode.id = id;
		scriptNode.src = 'misc.php?mod=secqaa&action=update&mobile=2&idhash=' + idhash + '&' + Math.random() + '&modid=' + modid;
		document.getElementsByTagName('head')[0].appendChild(scriptNode);
	}
	// 单独刷新安全验证：题目换新、答案输入框清空、验证码换图
	// ponytail: X5 移动版 common.js 只调用未定义 evalscript（桌面版才有），
	// 核心验证码/问答刷新脚本会因此中断；此垫片仅透传字符串（刷新注入内容
	// 不含 <script>），含脚本时需移植桌面版完整实现
	window.evalscript = window.evalscript || function (s) { return s; };
	window.nekoSecRefresh = function () {
		document.querySelectorAll('input[name="secqaahash"]').forEach(function (i) {
			window.updatesecqaa && updatesecqaa(i.value);
		});
		document.querySelectorAll('mdui-text-field[name="secanswer"], input[name="secanswer"]').forEach(function (i) { i.value = ''; });
		document.querySelectorAll('input[name="seccodehash"]').forEach(function (i) {
			window.updateseccode && updateseccode(i.value);
		});
		document.querySelectorAll('input[name="seccodeverify"]').forEach(function (i) { i.value = ''; });
	};
	// 安全验证表单 AJAX 提交：注册/登录及任何带安全问答的表单，出错走 Discuz
	// handlekey 回调协议（inajax=1），底部 snackbar 提示并局部刷新，不再跳整页
	window.errorhandle_nekoerr = function (msg) {
		mduiTip(msg, true);
		window.nekoSecRefresh();
	};
	window.succeedhandle_nekoerr = function (url, msg) {
		// 成功也走 snackbar 提示，停留 2 秒再跳转，否则用户感知不到成功
		if (msg) mduiTip(msg);
		if (url) setTimeout(function () { location.href = String(url).replace(/&amp;/g, '&'); }, msg ? 2000 : 0);
	};
	document.addEventListener('submit', function (e) {
		var f = e.target;
		if (e.defaultPrevented || !(f.id === 'registerform' || f.id === 'loginform' || f.querySelector('input[name="secqaahash"]'))) return;
		e.preventDefault();
		// 剥离 mobile 参数：inajax 响应与手机模式无关，但带 mobile 参数会被
		// Discuz _init_mobile 按 UA 判定 302 踢回桌面版（fetch 无法自定义 UA），
		// POST 数据随重定向丢失，表现为点注册按钮毫无提示
		var action = (f.getAttribute('action') || '').replace(/([?&])mobile=[^&]*&?/g, '$1').replace(/[?&]+$/, '');
		f.action = action;
		fetch(action + (action.indexOf('?') < 0 ? '?' : '&') + 'inajax=1&handlekey=nekoerr', {
			method: 'POST',
			body: new FormData(f),
			credentials: 'same-origin'
		}).then(function (r) { return r.text(); }).then(function (t) {
			var m = t.match(/<!\[CDATA\[([\s\S]*)\]\]>/);
			var box = document.createElement('div');
			box.innerHTML = m ? m[1] : t;
			var fired = false;
			box.querySelectorAll('script').forEach(function (old) {
				var code = old.textContent || '';
				if (!/errorhandle_nekoerr|succeedhandle_nekoerr|window\.location\.href/.test(code)) return;
				fired = true;
				var s = document.createElement('script');
				s.textContent = code;
				document.body.appendChild(s);
				s.remove();
			});
			// 兜底：响应里没有回调/跳转脚本时，提取消息文字弹消息条（如 showmessage
			// 带 handle=>false 的错误，如邮箱不合法），避免整页跳转丢失上下文；
			// 完全解析不出的脏数据才退回整页提交
			if (!fired) {
				box.querySelectorAll('script').forEach(function (s) { s.remove(); });
				var mt = box.querySelector('#messagetext') || box;
				var txt = mt.textContent.replace(/\s+/g, ' ').trim();
				if (txt) { mduiTip(txt, true); window.nekoSecRefresh(); }
				else f.submit();
			}
		}).catch(function () { f.submit(); });
	});
	</script>

	<!-- 折叠组件兼容：spoiler.js 在 head 中执行时按钮尚未渲染，改用事件委托按相邻关系开关内容，并拦截原脚本避免重复切换 -->
	<script>
	document.addEventListener('click', function(e) {
		var btn = e.target.closest ? e.target.closest('.toggleButton') : null;
		if(!btn) return;
		var c = btn.nextElementSibling;
		if(!c || !c.classList || !c.classList.contains('content')) {
			c = btn.parentElement ? btn.parentElement.querySelector(':scope > .content') : null;
		}
		if(c) {
			c.style.display = (window.getComputedStyle(c).display === 'none') ? 'block' : 'none';
			e.stopPropagation();
		}
	}, true);
	</script>
	<!-- X5 头像懒加载兼容：mobile/common.js 缺少 loadAvatar()，手动把 _avt 头像的 data-src 转为 src（修复 ahome_horn 等插件头像不显示） -->
	<script>
	document.addEventListener('DOMContentLoaded', function() {
		var defurl = typeof DEFAULTAVATAR != 'undefined' ? DEFAULTAVATAR : './data/avatar/noavatar.svg';
		var avatarurl = (typeof DEFAULTAVATAR != 'undefined' && DEFAULTAVATAR.lastIndexOf('/') !== -1) ? DEFAULTAVATAR.substring(0, DEFAULTAVATAR.lastIndexOf('/') + 1) : '';
		document.querySelectorAll('img._avt').forEach(function(img) {
			img.onerror = function() { this.onerror = null; this.src = defurl; };
			if(img.dataset.uid && avatarurl) {
				var size = img.dataset.size || 'middle';
				var uid = img.dataset.uid.toString().padStart(9, '0');
				var random = img.dataset.random ? '?r=' + img.dataset.random : '';
				img.dataset.src = avatarurl + uid.substring(0, 3) + '/' + uid.substring(3, 5) + '/' + uid.substring(5, 7) + '/' + uid.substring(7) + '_avatar_' + size + '.jpg' + random;
				delete img.dataset.uid; delete img.dataset.size; delete img.dataset.random;
			}
			if(img.dataset.src) {
				img.src = img.dataset.src;
				delete img.dataset.src;
			}
			img.classList.remove('_avt');
		});
	});
	</script>
