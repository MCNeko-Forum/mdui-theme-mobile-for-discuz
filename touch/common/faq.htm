<!--{template common/header}-->

<mdui-top-app-bar>
	<mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon>
	<mdui-top-app-bar-title>{lang faq}</mdui-top-app-bar-title>
	<div style="flex:1"></div>
	<mdui-button-icon icon="home" data-href="portal.php?mod=index"></mdui-button-icon>
</mdui-top-app-bar>

<style>
	.mdui-faq-page { padding:0 1rem 1.5rem; }
	.mdui-faq-tabs { margin:0 -1rem .75rem; overflow-x:auto; }
	.mdui-faq-tabs mdui-tabs { min-width:max-content; }
	.mdui-faq-search { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; }
	.mdui-faq-heading { margin:0 0 .75rem; font-size:1rem; font-weight:600; }
	.mdui-faq-group { display:block; margin-bottom:.75rem; }
	.mdui-faq-card { display:block; margin-bottom:.75rem; padding:1rem; }
	.mdui-faq-message { line-height:1.7; overflow-wrap:anywhere; }
	.mdui-faq-message img { max-width:100%; height:auto; }
</style>

<div class="mdui-faq-page">
	<!-- 分类导航：全部 + 后台配置的父级分类 + 插件帮助分类 -->
	<div class="mdui-faq-tabs">
		<mdui-tabs value="<!--{if $_GET['id']}-->$_GET['id']<!--{else}-->all<!--{/if}-->">
			<mdui-tab value="all" data-href="misc.php?mod=faq">{lang all}</mdui-tab>
			<!--{loop $faqparent $fpid $parent}-->
				<mdui-tab value="$fpid" data-href="misc.php?mod=faq&action=faq&id=$fpid">$parent['title']</mdui-tab>
			<!--{/loop}-->
			<!--{if !empty($_G['setting']['plugins']['faq'])}-->
				<!--{loop $_G['setting']['plugins']['faq'] $pluginid $module}-->
					<mdui-tab value="$pluginid" data-href="misc.php?mod=faq&action=plugin&id=$pluginid">$module['name']</mdui-tab>
				<!--{/loop}-->
			<!--{/if}-->
		</mdui-tabs>
	</div>

	<form method="post" autocomplete="off" action="misc.php?mod=faq&action=search" class="mdui-faq-search">
		<input type="hidden" name="formhash" value="{FORMHASH}" />
		<input type="hidden" name="searchtype" value="all" />
		<input type="hidden" name="searchsubmit" value="yes" />
		<mdui-text-field name="keyword" value="$keyword" label="{lang search}" icon="search" enterkeyhint="search" style="flex:1;min-width:0"></mdui-text-field>
		<mdui-button type="submit" style="flex:none">{lang search}</mdui-button>
	</form>

	<!--{if empty($_GET['action'])}-->
		<h1 class="mdui-faq-heading">{lang all}{lang faq}</h1>
		<!--{loop $faqparent $fpid $parent}-->
			<mdui-card variant="outlined" class="mdui-faq-group">
				<mdui-list>
					<mdui-list-item rounded href="misc.php?mod=faq&action=faq&id=$fpid" icon="help_outline">$parent['title']</mdui-list-item>
					<!--{loop $faqsub[$parent['id']] $sub}-->
						<mdui-list-item rounded href="misc.php?mod=faq&action=faq&id=$sub['fpid']&messageid=$sub['id']" style="padding-left:1.5rem">
							<span style="font-size:.875rem">$sub['title']</span>
						</mdui-list-item>
					<!--{/loop}-->
				</mdui-list>
			</mdui-card>
		<!--{/loop}-->
	<!--{elseif $_GET['action'] == 'faq'}-->
		<h1 class="mdui-faq-heading">$ctitle</h1>
		<!-- 手风琴模式下 value 可以直接给初始展开项，正好对应后端算出的 $messageid -->
		<!-- mdui-collapse 要求 mdui-collapse-item 是直接子元素，所以卡片包在外层 -->
		<mdui-card variant="outlined" style="display:block">
			<mdui-collapse accordion value="$messageid">
				<!--{loop $faqlist $faq}-->
					<mdui-collapse-item value="$faq['id']">
						<div slot="header" style="flex:1;padding:1rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere">$faq['title']</div>
						<div class="mdui-faq-message" style="padding:0 1rem 1rem">$faq['message']</div>
					</mdui-collapse-item>
				<!--{/loop}-->
			</mdui-collapse>
		</mdui-card>
	<!--{elseif $_GET['action'] == 'search'}-->
		<h1 class="mdui-faq-heading">{lang keyword_faq}</h1>
		<!--{if $faqlist}-->
			<!--{loop $faqlist $faq}-->
				<mdui-card variant="outlined" class="mdui-faq-card">
					<div style="font-weight:600;margin-bottom:.5rem">$faq['title']</div>
					<div class="mdui-faq-message">$faq['message']</div>
				</mdui-card>
			<!--{/loop}-->
		<!--{else}-->
			<div style="padding:2rem 0;text-align:center;color:rgb(var(--mdui-color-on-surface-variant))">{lang faq_search_nomatch}</div>
		<!--{/if}-->
	<!--{elseif $_GET['action'] == 'plugin' && !empty($_GET['id'])}-->
		<mdui-card variant="outlined" class="mdui-faq-card">
			<div class="mdui-faq-message"><!--{eval include(template($_GET['id']));}--></div>
		</mdui-card>
	<!--{/if}-->

	<!--{hook/faq_extra}-->
</div>

<!--{template common/footer}-->
