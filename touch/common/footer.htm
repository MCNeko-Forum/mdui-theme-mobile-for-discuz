<style>

<script>
// 没有上一页时（新标签打开、外链直入）藏掉返回按钮，避免点了没反应。
// history.length 在同标签内至少为 2，直入时为 1
history.length < 2 && document.querySelectorAll('[onclick="history.back()"]').forEach(function (b) {
	b.style.display = 'none';
});
document.querySelector('#mdui_menu_btn')?.addEventListener('click', function () {
	document.querySelector('#mdui_drawer').open = true;
});
// 从屏幕左边缘向右滑动打开侧边栏（参考触发区域 20px）
(function () {
	var drawer = document.querySelector('#mdui_drawer');
	var startX = 0;
	var startY = 0;
	var edgeZone = 20;
	if (!drawer) return;
	document.addEventListener('touchstart', function (event) {
		var touch = event.touches[0];
		if (touch && touch.clientX <= edgeZone) {
			startX = touch.clientX;
			startY = touch.clientY;
		} else {
			startX = 0;
		}
	}, {passive: true});
	document.addEventListener('touchend', function (event) {
		if (startX === 0) return;
		var touch = event.changedTouches[0];
		if (!touch) return;
		if (touch.clientX - startX >= 60 && touch.clientX - startX > Math.abs(touch.clientY - startY)) drawer.open = true;
		startX = 0;
	}, {passive: true});
})();
document.querySelector('#mdui_theme_toggle')?.addEventListener('click', function () {
	var next = {light: 'dark', dark: 'auto', auto: 'light'}[mdui.getTheme()];
	mdui.setTheme(next);
	document.cookie = 'mdui_theme=' + next + ';path=/;max-age=31536000';
});
(function () {
	var m = document.cookie.match(/(?:^|;\s*)mdui_theme=(light|dark|auto)/);
	m && mdui.setTheme(m[1]);
})();
// mdui-tab 没有 href 属性（不同于 mdui-navigation-bar-item），用 data-href 事件委托实现跳转
// 使用 composedPath() 兼容点击组件内部 Shadow DOM 内容的情况
 document.addEventListener('click', function (e) {
	var link = e.target.closest && e.target.closest('[data-href]');
	if (!link && e.composedPath) {
		link = e.composedPath().find(function (node) {
			return node && node.matches && node.matches('[data-href]');
		});
	}
	if (link && link.dataset.href) location.href = link.dataset.href;
});
// 激活项滚动进视野，让当前位置在长导航里可见
document.querySelectorAll('mdui-tabs').forEach(function (tabs) {
	tabs.updateComplete && tabs.updateComplete.then(function () {
		var active = tabs.querySelector('mdui-tab[active]');
		active && active.scrollIntoView({block: 'nearest', inline: 'center'});
	});
});

// 发布面板开合时切换加号/关闭图标，并让加号在面板打开时充当关闭按钮
(function () {
	var sheet = document.getElementById('mdui_post_sheet');
	var btn = document.querySelector('mdui-navigation-bar-item[value=post]');

	if (!sheet || !btn) return;

	sheet.addEventListener('open', function () {
		btn.icon = 'close';
		document.body.classList.add('mdui-post-sheet-open');
	});
	sheet.addEventListener('close', function () {
		btn.icon = 'add_circle';
		document.body.classList.remove('mdui-post-sheet-open');
	});
})();

// 全局提示：Discuz 的 showmessage 支持 &ajaxdata=json 直接返回 {message, data}，
// 比解析 <root><![CDATA[html]]></root> 干净。统一用 snackbar 显示在底部。
window.mduiTip = function (text, err) {
	if (!text) return;
	mdui.snackbar({
		message: String(text).replace(/<[^>]+>/g, '').trim(),
		placement: 'bottom',
		autoCloseDelay: err ? 5000 : 3000,
		closeable: !!err
	});
};

// 走 Discuz 的 json 提示通道。成功后按需刷新，失败也给出提示不静默
window.mduiPost = function (url, data, done) {
	var body = new URLSearchParams(data || {});
	body.set('formhash', '{FORMHASH}');
	fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'inajax=1&ajaxdata=json&mobile=2', {
		method: 'POST',
		headers: {'Content-Type': 'application/x-www-form-urlencoded'},
		body: body,
		credentials: 'same-origin'
	}).then(function (r) {
		return r.json();
	}).then(function (j) {
		mduiTip(j.message);
		done && done(j);
	}).catch(function () {
		// json 通道拿不到（插件输出脏数据等），退回整页跳转，功能不能断
		location.href = url;
	});
};

// 同 mduiPost，但用 GET。Discuz 某些接口只读 GET 参数（如 recommend 的 hash）
window.mduiGet = function (url, done) {
	fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'inajax=1&ajaxdata=json&mobile=2', {
		method: 'GET',
		credentials: 'same-origin'
	}).then(function (r) {
		return r.json();
	}).then(function (j) {
		mduiTip(j.message);
		done && done(j);
	}).catch(function () {
		location.href = url;
	});
};
</script>
