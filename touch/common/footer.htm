<script>
// 没有上一页时（新标签打开、外链直入）藏掉返回按钮，避免点了没反应。
// history.length 在同标签内至少为 2，直入时为 1
history.length < 2 && document.querySelectorAll('[onclick="history.back()"]').forEach(function (b) {
	b.style.display = 'none';
});
// 菜单按钮用 document 事件委托：PJAX 换掉 #mdui_app 后按钮是新节点，直接绑定会失效。
// 组件内部是 Shadow DOM，点击时 e.target 被 retarget 成宿主元素，用 composedPath 兜底
document.addEventListener('click', function (e) {
	var btn = (e.target.closest && e.target.closest('#mdui_menu_btn')) ||
		(e.composedPath && e.composedPath().find(function (node) {
			return node && node.id === 'mdui_menu_btn';
		}));
	if (!btn) return;
	var drawer = document.querySelector('#mdui_drawer');
	if (drawer) drawer.open = true;
});
// 从屏幕左边缘向右滑动打开侧边栏（参考触发区域 20px）
(function () {
	var drawer = document.querySelector('#mdui_drawer');
	var startX = 0;
	var startY = 0;
	var edgeZone = 20;
	if (!drawer) return;
	document.addEventListener('touchstart', function (event) {
		var touch = event.touches[0];
		if (touch && touch.clientX <= edgeZone) {
			startX = touch.clientX;
			startY = touch.clientY;
		} else {
			startX = 0;
		}
	}, {passive: true});
	document.addEventListener('touchend', function (event) {
		if (startX === 0) return;
		var touch = event.changedTouches[0];
		if (!touch) return;
		if (touch.clientX - startX >= 60 && touch.clientX - startX > Math.abs(touch.clientY - startY)) drawer.open = true;
		startX = 0;
	}, {passive: true});
})();
// 夜间/日间/自动共用一个按钮：点击在三种模式间循环，图标和文字实时显示当前模式（侧边栏与“我的”页共用，事件委托）
(function () {
	var modes = {dark: ['dark_mode', '夜间'], light: ['light_mode', '日间'], auto: ['brightness_auto', '自动']};
	function syncThemeItems() {
		var cur = mdui.getTheme();
		if (!modes[cur]) cur = 'auto';
		document.querySelectorAll('[data-mdui-theme-cycle]').forEach(function (item) {
			item.setAttribute('icon', modes[cur][0]);
			var label = item.querySelector('.mdui-theme-label');
			if (label) label.textContent = modes[cur][1];
		});
	}
	document.addEventListener('click', function (e) {
		var item = e.target.closest && e.target.closest('[data-mdui-theme-cycle]');
		if (!item) return;
		var cur = mdui.getTheme();
		var next = {dark: 'light', light: 'auto', auto: 'dark'}[cur] || 'dark';
		mdui.setTheme(next);
		document.cookie = 'mdui_theme=' + next + ';path=/;max-age=31536000';
		syncThemeItems();
	});
	var m = document.cookie.match(/(?:^|;\s*)mdui_theme=(light|dark|auto)/);
	m && mdui.setTheme(m[1]);
	syncThemeItems();
	// PJAX 换页时抽屉会被同步重建，重跑一次让主题图标/文字跟上当前模式
	document.addEventListener('mduipjax:load', syncThemeItems);
})();
// Cloudflare Email Obfuscation 会把邮箱替换成 [email protected] + data-cfemail，
// 官方解码脚本只处理首屏内容，PJAX 换页插进来的永远没人解码；
// 这里自带同款解码算法，首次加载和每次 PJAX 后各跑一遍
(function () {
	function decodeCfEmail(hex) {
		var key = parseInt(hex.substr(0, 2), 16), out = '';
		for (var i = 2; i < hex.length; i += 2) {
			out += String.fromCharCode(key ^ parseInt(hex.substr(i, 2), 16));
		}
		return out;
	}
	function decodeAll(root) {
		(root || document).querySelectorAll('[data-cfemail]').forEach(function (el) {
			var email = decodeCfEmail(el.getAttribute('data-cfemail'));
			if (!email) return;
			// 文本占位换回真实邮箱；外层若是 email-protection 链接顺手改成 mailto
			el.textContent = email;
			el.removeAttribute('data-cfemail');
			var link = el.closest && el.closest('a[href*="/cdn-cgi/l/email-protection"]');
			if (link) link.href = 'mailto:' + email;
		});
		// 邮箱在 href 里（如 mailto 被保护）的场景
		(root || document).querySelectorAll('a[href*="/cdn-cgi/l/email-protection#"]').forEach(function (link) {
			var hex = (link.getAttribute('href') || '').split('#')[1];
			var email = hex && decodeCfEmail(hex);
			if (email) link.href = 'mailto:' + email;
		});
	}
	window.mduiDecodeEmails = decodeAll;
	document.addEventListener('DOMContentLoaded', function () { decodeAll(document); });
	document.addEventListener('mduipjax:load', function () { decodeAll(document); });
})();
// mdui-tab 没有 href 属性（不同于 mdui-navigation-bar-item），用 data-href 事件委托实现跳转
// 使用 composedPath() 兼容点击组件内部 Shadow DOM 内容的情况
 document.addEventListener('click', function (e) {
	if (e.defaultPrevented) return;
	var link = e.target.closest && e.target.closest('[data-href]');
	if (!link && e.composedPath) {
		link = e.composedPath().find(function (node) {
			return node && node.matches && node.matches('[data-href]');
		});
	}
	if (link && link.dataset.href) {
		e.preventDefault();
		window.mduiNav ? mduiNav(link.dataset.href) : location.href = link.dataset.href;
	}
});
// 激活项滚动进视野，让当前位置在长导航里可见
document.querySelectorAll('mdui-tabs').forEach(function (tabs) {
	tabs.updateComplete && tabs.updateComplete.then(function () {
		var active = tabs.querySelector('mdui-tab[active]');
		active && active.scrollIntoView({block: 'nearest', inline: 'center'});
	});
});

// 发布面板开合时切换加号/关闭图标，并让加号在面板打开时充当关闭按钮
(function () {

})();

// 全局提示：Discuz 的 showmessage 支持 &ajaxdata=json 直接返回 {message, data}，
// 比解析 <root><![CDATA[html]]></root> 干净。统一用 snackbar 显示在底部。
window.mduiTip = function (text, err) {
	if (!text) return;
	mdui.snackbar({
		message: String(text).replace(/<[^>]+>/g, '').trim(),
		placement: 'bottom',
		autoCloseDelay: err ? 5000 : 3000,
		closeable: !!err
	});
};

// 走 Discuz 的 json 提示通道。成功后按需刷新，失败也给出提示不静默
window.mduiPost = function (url, data, done) {
	var body = new URLSearchParams(data || {});
	body.set('formhash', '{FORMHASH}');
	fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'inajax=1&ajaxdata=json&mobile=2', {
		method: 'POST',
		headers: {'Content-Type': 'application/x-www-form-urlencoded'},
		body: body,
		credentials: 'same-origin'
	}).then(function (r) {
		return r.json();
	}).then(function (j) {
		mduiTip(j.message);
		done && done(j);
	}).catch(function () {
		// json 通道拿不到（插件输出脏数据等），退回整页跳转，功能不能断
		location.href = url;
	});
};

// 同 mduiPost，但用 GET。Discuz 某些接口只读 GET 参数（如 recommend 的 hash）
window.mduiGet = function (url, done) {
	fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 'inajax=1&ajaxdata=json&mobile=2', {
		method: 'GET',
		credentials: 'same-origin'
	}).then(function (r) {
		return r.json();
	}).then(function (j) {
		mduiTip(j.message);
		done && done(j);
	}).catch(function () {
		location.href = url;
	});
};
</script>

<script>
// 积分变动提示：Discuz 把本次变动写进 creditnotice / creditbase / creditrule 三个 cookie，
// 桌面版用居中弹窗展示。手机版改成底部消息条，读完即清，避免每次翻页重复提示。
(function () {
	function readCookie(name) {
		var key = cookiepre + name + '=';
		// 前面补分隔符，避免 cookiepre 前缀相同（creditnotice / creditrule）时误匹配
		var all = '; ' + document.cookie;
		var start = all.indexOf('; ' + key);
		if (start < 0) return '';
		start += 2 + key.length;
		var end = all.indexOf(';', start);
		return all.substring(start, end < 0 ? all.length : end);
	}
	function clearCookie(name) {
		document.cookie = cookiepre + name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=' + (cookiepath || '/') + (cookiedomain ? '; domain=' + cookiedomain : '');
	}

	var raw = readCookie('creditnotice');
	if (!raw) return;
	var notice = raw.split('D');
	if (!discuz_uid || notice.length < 2 || notice[9] != discuz_uid) {
		clearCookie('creditnotice');
		clearCookie('creditrule');
		return;
	}

	var info = [];
	creditnotice.split(',').forEach(function (item) {
		var e = item.split('|');
		info[e[0]] = [e[1], e[2]];
	});

	var parts = [];
	for (var i = 1; i <= 8; i++) {
		var delta = parseInt(notice[i], 10);
		if (!delta || !info[i]) continue;
		parts.push(info[i][0] + (delta > 0 ? ' +' : ' ') + delta + (info[i][1] || ''));
	}

	var rule = '';
	try {
		// PHP setcookie 用 urlencode，空格会变成 +，先还原再解码
		rule = decodeURI(readCookie('creditrule').replace(/\+/g, ' ')).replace(/\t/g, ' ');
	} catch (e) {
		rule = '';
	}

	clearCookie('creditnotice');
	clearCookie('creditbase');
	clearCookie('creditrule');
	if (!parts.length) return;

	// mdui.global.js 是 module 脚本，解析完才会执行，等 DOMContentLoaded 再弹
	document.addEventListener('DOMContentLoaded', function () {
		window.mduiTip((rule ? rule + '：' : '') + parts.join('，'));
	});
})();
</script>

<script>
// 复制外链：clipboard API 优先，execCommand 兜底，成功后消息条提示
(function () {
	function mduiTip(msg) { mdui.snackbar({ message: msg }); }
	document.addEventListener('click', function (e) {
		var btn = (e.target.closest && e.target.closest('#mdui_extlink_copy')) ||
			(e.composedPath && e.composedPath().some(function (n) { return n && n.id === 'mdui_extlink_copy'; }));
		if (!btn) return;
		var url = document.getElementById('mdui_extlink_url').textContent;
		var done = function () {
			document.getElementById('mdui_extlink').hidden = true;
			mduiTip('复制链接成功');
		};
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(url).then(done, function () { fallback(url, done); });
		} else {
			fallback(url, done);
		}
		function fallback(text, cb) {
			var ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.select();
			try { document.execCommand('copy'); cb(); } catch (err) {}
			ta.remove();
		}
	});
	// 图片加载失败：保留父级 <a> 让失败块仍可点开预览，用 replaceChildren 换成提示块
	document.addEventListener('error', function (e) {
		var img = e.target;
		if (!img || img.tagName !== 'IMG' || img.hasAttribute('smilieid')) return;
		var link = img.closest && img.closest('a[href]');
		var box = document.createElement('div');
		box.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:3rem;width:100%;font-size:.875rem;color:rgb(var(--mdui-color-error));background:rgb(var(--mdui-color-surface-container-highest));border-radius:8px';
		box.textContent = '加载失败';
		if (link) link.replaceChildren(box);
		else if (img.parentNode) img.replaceWith(box);
	}, true);
})();
</script>

<script>
// 站外链接提醒：MDUI_EXTLINK=1 时拦截外链；MDUI_EXTLINK_WHITE 为域名白名单，逗号或换行分隔
(function () {
	var enabled = '{$_G[style][mdui_extlink]}';
	if (enabled !== '1') return;
	// 白名单来自后台多行文本，值里带换行，不能直接写进 JS 字符串，否则整段脚本语法错误、点击不会拦截
	var white = {eval echo json_encode(preg_split('/[\s,，]+/', strtolower((string)$_G['style']['mdui_extlink_white']), -1, PREG_SPLIT_NO_EMPTY) ?: array());};
	var host = location.hostname.replace(/^www\./, '').toLowerCase();
	document.addEventListener('click', function (e) {
		var path = e.composedPath ? e.composedPath() : [];
		var go = (e.target.closest && e.target.closest('#mdui_extlink_go')) || path.some(function (node) {
			return node && node.id === 'mdui_extlink_go';
		});
		if (go) {
			document.getElementById('mdui_extlink').hidden = true;
			return;
		}
		if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
		var link = e.target.closest && e.target.closest('a[href]');
		if (!link) {
			link = path.find(function (node) {
				return node && node.matches && node.matches('a[href]');
			});
		}
		if (!link || link.closest('#mdui_extlink')) return;
		var href = link.getAttribute('href');
		if (!href || href.charAt(0) === '#' || /^(javascript|mailto|tel):/i.test(href)) return;
		var url;
		try { url = new URL(href, location.href); } catch (err) { return; }
		if (url.protocol !== 'http:' && url.protocol !== 'https:') return;
		var dest = url.hostname.replace(/^www\./, '').toLowerCase();
		if (dest === host) return;
		if (white.some(function (item) {
			item = item.replace(/^www\./, '');
			return dest === item || dest.slice(-(item.length + 1)) === '.' + item;
		})) return;
		e.preventDefault();
		e.stopPropagation();
		document.getElementById('mdui_extlink_go').href = url.href;
		document.getElementById('mdui_extlink_url').textContent = url.href;
		document.getElementById('mdui_extlink').hidden = false;
	}, true);
})();
</script>
