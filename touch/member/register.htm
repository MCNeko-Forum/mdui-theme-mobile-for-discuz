<!--{eval $nofooter = 1;}-->
<!--{eval $mdui_strongpw = is_array($mdui_strongpw) ? $mdui_strongpw : array();}-->
<!--{template common/header}-->

<mdui-top-app-bar>
	<mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon>
	<mdui-top-app-bar-title>{$_G['setting']['reglinkname']}</mdui-top-app-bar-title>
</mdui-top-app-bar>

<div style="padding:2rem 1.5rem;max-width:480px;margin:0 auto">
	<form method="post" autocomplete="off" name="register" id="registerform"
		action="member.php?mod={$_G['setting']['regname']}&mobile=2">
		<input type="hidden" name="regsubmit" value="yes" />
		<input type="hidden" name="formhash" value="{FORMHASH}" />
		<!--{eval $dreferer = str_replace('&amp;', '&', dreferer());}-->
		<input type="hidden" name="referer" value="$dreferer" />
		<input type="hidden" name="activationauth" value="{if $_GET['action'] == 'activation'}$activationauth{/if}" />
		<!--{if $_G['setting']['sendregisterurl']}-->
			<input type="hidden" name="hash" value="$_GET['hash']" />
		<!--{/if}-->

		<!--{if $sendurl}-->
			<mdui-text-field type="email" name="{$_G['setting']['reginput']['email']}" label="{lang registeremail}"
				icon="mail" autocomplete="off" style="margin-bottom:1rem"></mdui-text-field>
		<!--{else}-->
			<!--{if empty($invite) && in_array($_G['setting']['regstatus'], array(2, 3))}-->
				<mdui-text-field name="invitecode" label="{lang invite_code}<!--{if $_G['setting']['regstatus'] == 3}-->（非必填）<!--{/if}-->" icon="card_giftcard"
					autocomplete="off" style="margin-bottom:1rem"></mdui-text-field>
			<!--{/if}-->
			<mdui-text-field id="mdui_register_username" name="{$_G['setting']['reginput']['username']}" label="{lang registerinputtip}"
				icon="person" autocomplete="off" style="margin-bottom:.375rem"></mdui-text-field>
			<div id="mdui_register_username_tip" class="mdui-register-tip" hidden></div>
			<!--{eval $mdui_strongpw = is_array($_G['setting']['strongpw']) ? $_G['setting']['strongpw'] : array();}-->
			<mdui-text-field id="mdui_register_password" type="password" name="{$_G['setting']['reginput']['password']}" label="{lang login_password}"
				icon="lock" toggle-password required<!--{if $_G['setting']['pwlength']}--> minlength="{$_G['setting']['pwlength']}"<!--{/if}--> style="margin-bottom:.375rem"></mdui-text-field>
			<div id="mdui_register_password_tip" class="mdui-register-tip" hidden></div>
			<mdui-text-field id="mdui_register_password2" type="password" name="{$_G['setting']['reginput']['password2']}" label="{lang registerpassword2}"
				icon="lock_reset" toggle-password required style="margin-bottom:.375rem"></mdui-text-field>
			<div id="mdui_register_password2_tip" class="mdui-register-tip" hidden></div>
			<mdui-text-field id="mdui_register_email" type="email" name="{$_G['setting']['reginput']['email']}" label="{lang registeremail}"
				icon="mail" value="$hash[0]" autocomplete="off" style="margin-bottom:.375rem"></mdui-text-field>
			<div id="mdui_register_email_tip" class="mdui-register-tip" hidden></div>

			<!--{loop $_G['cache']['fields_register'] $field}-->
				<!--{if $htmls[$field['fieldid']]}-->
					<div style="margin-bottom:1rem">$htmls[$field['fieldid']]</div>
				<!--{/if}-->
			<!--{/loop}-->
		<!--{/if}-->
		<!--{hook/register_input_mobile}-->

		<!--{if $secqaacheck || $seccodecheck}-->
		<!--{block sectpl}--><div class="rfm"><sec><br /><sec>: <sec><br /><sec></div><!--{/block}-->
		<div style="margin-bottom:1rem"><!--{subtemplate common/seccheck}--></div>
	<!--{/if}-->

		<!--{if $bbrules}-->
			<div style="display:flex;align-items:center;gap:.25rem;margin-bottom:1rem">
				<mdui-checkbox id="mdui_agreebbrule" name="agreebbrule" value="{$bbrulehash}" required checked>{lang agree}</mdui-checkbox>
				<mdui-button type="button" variant="text" onclick="document.getElementById('mdui_bbrule').open=true">{lang rulemessage}</mdui-button>
			</div>
			<mdui-dialog id="mdui_bbrule" close-on-esc close-on-overlay-click headline="{lang rulemessage}">
				<div slot="description" style="max-height:60dvh;overflow:auto;line-height:1.7">$bbrulestxt</div>
			</mdui-dialog>
		<!--{/if}-->

		<mdui-button type="submit" name="regsubmit" value="true" full-width>{lang quickregister}</mdui-button>
	</form>

	<style>
	.mdui-register-tip { margin: .25rem 0 1rem; font-size: .8125rem; line-height: 1.5; color: rgb(var(--mdui-color-error)); }
	.mdui-register-tip[hidden] { display: none; }
	</style>
	<script>
	(function () {
		var form = document.getElementById('registerform');
		var username = document.getElementById('mdui_register_username');
		var password = document.getElementById('mdui_register_password');
		var password2 = document.getElementById('mdui_register_password2');
		var email = document.getElementById('mdui_register_email');
		var tips = {
			username: document.getElementById('mdui_register_username_tip'),
			password: document.getElementById('mdui_register_password_tip'),
			password2: document.getElementById('mdui_register_password2_tip'),
			email: document.getElementById('mdui_register_email_tip')
		};
		var rules = {
			length: {$_G['setting']['pwlength'] ? $_G['setting']['pwlength'] : 0},
			digit: <!--{if in_array(1, $mdui_strongpw)}-->true<!--{else}-->false<!--{/if}-->,
			lower: <!--{if in_array(2, $mdui_strongpw)}-->true<!--{else}-->false<!--{/if}-->,
			upper: <!--{if in_array(3, $mdui_strongpw)}-->true<!--{else}-->false<!--{/if}-->,
			symbol: <!--{if in_array(4, $mdui_strongpw)}-->true<!--{else}-->false<!--{/if}-->
		};
		var lastUsername = '';
		var lastEmail = '';
		function fieldValue(field) {
			var input = field.querySelector('input') || field;
			return input.value || '';
		}
		function showTip(name, text) {
			tips[name].hidden = !text;
			tips[name].textContent = text || '';
		}
		function passwordError() {
			var value = fieldValue(password);
			if (!value) return '';
			if (rules.length && value.length < rules.length) return '密码太短，不得少于 ' + rules.length + ' 个字符';
			var missing = [];
			if (rules.digit && !/\d/.test(value)) missing.push('数字');
			if (rules.lower && !/[a-z]/.test(value)) missing.push('小写字母');
			if (rules.upper && !/[A-Z]/.test(value)) missing.push('大写字母');
			if (rules.symbol && !/[^A-Za-z0-9]/.test(value)) missing.push('特殊符号');
			return missing.length ? '密码太弱，密码中必须包含 ' + missing.join(',') : '';
		}
		function checkPassword() {
			showTip('password', passwordError());
			if (fieldValue(password2) && fieldValue(password) !== fieldValue(password2)) showTip('password2', '两次输入的密码不一致');
			else if (fieldValue(password2)) showTip('password2', '');
		}
		function checkUsername() {
			var value = fieldValue(username).trim();
			if (!value || value === lastUsername) return;
			lastUsername = value;
			if (/[<>"'()]/.test(value)) {
				showTip('username', '用户名包含敏感字符');
				return;
			}
			var length = value.replace(/[^\x00-\xff]/g, '**').length;
			if (length < 3) {
				showTip('username', '用户名不得小于 3 个字符');
				return;
			}
			if (length > 15) {
				showTip('username', '用户名不得超过 15 个字符');
				return;
			}
			showTip('username', '');
			fetch('forum.php?mod=ajax&inajax=1&ajaxdata=json&action=checkusername&username=' + encodeURIComponent(value), {credentials: 'same-origin'})
				.then(function (response) { return response.json(); })
				.then(function (result) {
					if (result && result.message) showTip('username', String(result.message).replace(/<[^>]+>/g, '').trim());
				})
				.catch(function () {});
		}
		function checkEmail() {
			var value = fieldValue(email).trim();
			if (!value || value === lastEmail) return;
			lastEmail = value;
			if (/[<"]/.test(value)) {
				showTip('email', 'Email 包含敏感字符');
				return;
			}
			showTip('email', '');
			fetch('forum.php?mod=ajax&inajax=1&ajaxdata=json&action=checkemail&email=' + encodeURIComponent(value), {credentials: 'same-origin'})
				.then(function (response) { return response.json(); })
				.then(function (result) {
					if (result && result.message) showTip('email', String(result.message).replace(/<[^>]+>/g, '').trim());
				})
				.catch(function () {});
		}
		username.addEventListener('blur', checkUsername);
		password.addEventListener('input', checkPassword);
		password.addEventListener('blur', checkPassword);
		password2.addEventListener('input', checkPassword);
		password2.addEventListener('blur', function () {
			if (!fieldValue(password2)) showTip('password2', '请再次输入密码');
			else checkPassword();
		});
		email.addEventListener('blur', checkEmail);
		form.addEventListener('submit', function (event) {
			checkUsername();
			checkPassword();
			checkEmail();
			if (passwordError()) {
				event.preventDefault();
				password.focus();
			} else if (fieldValue(password) !== fieldValue(password2)) {
				event.preventDefault();
				showTip('password2', fieldValue(password2) ? '两次输入的密码不一致' : '请再次输入密码');
				password2.focus();
			}
		});
	})();
	</script>
	<!--{if $bbrules && $bbrulesforce}-->
	<script>document.getElementById('mdui_bbrule').open = true;</script>
	<!--{/if}-->

	<div style="text-align:center;margin-top:1.5rem">
		<mdui-button variant="text" href="member.php?mod=logging&action=login&referer={echo rawurlencode($dreferer)}">
			{lang login_now}
		</mdui-button>
	</div>
</div>

<!--{hook/register_bottom_mobile}-->
<!--{template common/footer}-->
