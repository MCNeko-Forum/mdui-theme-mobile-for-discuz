<!--{template common/header}-->

<mdui-top-app-bar>
	<mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon>
	<mdui-top-app-bar-title>{lang guide}</mdui-top-app-bar-title>
	<div style="flex-grow:1"></div>
	<mdui-button-icon icon="search" href="search.php?mod=forum" title="{lang search}"></mdui-button-icon>
</mdui-top-app-bar>
<!--{hook/guide_top_mobile}-->

<style>
	.mdui-guide-page { padding:0 1rem 5.5rem; }
	.mdui-guide-tabs { margin:0 -1rem 1rem; overflow-x:auto; }
	.mdui-guide-tabs mdui-tabs { min-width:max-content; }
	.mdui-guide-section { margin:1rem 0; }
	.mdui-guide-section-title { margin:0 0 .5rem; font-size:1rem; font-weight:600; }
	.mdui-guide-thread { display:block; margin:.625rem 0; padding:0; overflow:hidden; }
	.mdui-guide-thread-main { display:flex; gap:.75rem; padding:.875rem; color:inherit; text-decoration:none; }
	.mdui-guide-thread-main:hover { background:rgba(var(--mdui-color-on-surface), .04); }
	.mdui-guide-thread-avatar { flex:0 0 auto; width:2.5rem; height:2.5rem; }
	.mdui-guide-thread-content { min-width:0; flex:1; }
	.mdui-guide-thread-title { display:flex; align-items:flex-start; gap:.375rem; font-weight:500; line-height:1.45; }
	.mdui-guide-thread-title span:last-child { min-width:0; }
	.mdui-guide-thread-summary { display:-webkit-box; overflow:hidden; margin-top:.375rem; color:rgb(var(--mdui-color-on-surface-variant)); font-size:.875rem; line-height:1.5; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
	.mdui-guide-thread-meta { display:flex; flex-wrap:wrap; gap:.25rem .75rem; margin-top:.5rem; color:rgb(var(--mdui-color-on-surface-variant)); font-size:.75rem; }
	.mdui-guide-thread-images { display:grid; grid-template-columns:repeat(3, 1fr); gap:.25rem; padding:0 .875rem .875rem; }
	.mdui-guide-thread-images img { display:block; width:100%; aspect-ratio:1.5; border-radius:.375rem; object-fit:cover; }
	.mdui-guide-empty { padding:2rem 1rem; text-align:center; color:rgb(var(--mdui-color-on-surface-variant)); }
	.mdui-guide-my-filter { display:grid; gap:.75rem; margin-bottom:1rem; }
	.mdui-guide-my-filter select { box-sizing:border-box; width:100%; min-height:3.5rem; padding:0 .75rem; border:1px solid rgb(var(--mdui-color-outline)); border-radius:.25rem; background:transparent; color:inherit; }
</style>

<div class="mdui-guide-page">
	<div class="mdui-guide-tabs">
		<mdui-tabs value="$view">
			<mdui-tab value="newthread" data-href="forum.php?mod=guide&view=newthread">{lang latest}</mdui-tab>
			<mdui-tab value="hot" data-href="forum.php?mod=guide&view=hot">{lang order_heats}</mdui-tab>
			<mdui-tab value="digest" data-href="forum.php?mod=guide&view=digest">{lang digest}</mdui-tab>
			<mdui-tab value="new" data-href="forum.php?mod=guide&view=new">{lang join_thread}</mdui-tab>
			<mdui-tab value="sofa" data-href="forum.php?mod=guide&view=sofa">{lang guide_sofa}</mdui-tab>
			<!--{if $_G['uid']}--><mdui-tab value="my" data-href="forum.php?mod=guide&view=my">{lang guide_my}</mdui-tab><!--{/if}-->
			<mdui-tab value="index" data-href="forum.php?mod=guide&view=index">{lang guide}</mdui-tab>
			<mdui-tab value="forumlist" data-href="forum.php?forumlist=1">{lang guide_forumlist}</mdui-tab>
		</mdui-tabs>
	</div>

	<!--{if $view == 'my'}-->
		<form method="get" action="forum.php" class="mdui-guide-my-filter">
			<input type="hidden" name="mod" value="guide">
			<input type="hidden" name="view" value="my">
			<mdui-select name="type" label="类型" value="$viewtype">
				<mdui-menu-item value="thread">{lang mypost}</mdui-menu-item>
				<mdui-menu-item value="reply">{lang myreply}</mdui-menu-item>
				<mdui-menu-item value="postcomment">{lang comments}</mdui-menu-item>
			</mdui-select>
			<!--{if $viewtype != 'postcomment'}-->
				<mdui-select name="filter" label="状态" value="$filter">
					<mdui-menu-item value="">{lang all}</mdui-menu-item>
					<!--{loop $filter_array $filter_key $filter_name}--><mdui-menu-item value="$filter_key">$filter_name</mdui-menu-item><!--{/loop}-->
				</mdui-select>
				<select name="fid" aria-label="{lang guide_forum_select}">
					<option value="0">{lang guide_forum_select}：{lang all}</option>
					$forumlist
				</select>
			<!--{/if}-->
			<!--{if $viewtype == 'thread'}--><mdui-text-field name="searchkey" value="$searchkey" label="{lang keyword}"></mdui-text-field><!--{/if}-->
			<mdui-button type="submit" variant="tonal">{lang search}</mdui-button>
		</form>
	<!--{/if}-->

	<!--{if $view == 'index'}-->
		<!--{loop $data $guide_view $list}-->
			<!--{eval $guide_section_title = $lang['guide_'.$guide_view];}-->
			<div class="mdui-guide-section">
				<div class="mdui-guide-section-title">$guide_section_title</div>
				<!--{subtemplate forum/guide_list_row}-->
			</div>
		<!--{/loop}-->
	<!--{else}-->
		<!--{loop $data $guide_view $list}-->
			<!--{subtemplate forum/guide_list_row}-->
		<!--{/loop}-->
		$multipage
	<!--{/if}-->
</div>

<!--{template common/footer}-->
