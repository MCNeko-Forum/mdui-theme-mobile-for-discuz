<!-- 辩论主题的附加表单：正反方观点必填，裁判失焦时校验用户是否存在 -->
<mdui-card variant="outlined" style="display:block;padding:.75rem;margin-top:1rem">
	<!-- endtime 后端按字符串日期解析，用 date 类型省掉手写格式 -->
	<mdui-text-field type="date" name="endtime" id="endtime" variant="outlined" label="{lang endtime}" helper="{lang admin_close_expire_comment}" value="$debate['endtime']"></mdui-text-field>
	<mdui-text-field name="umpire" id="umpire" variant="outlined" label="{lang debate_umpire}" autocomplete="off" value="$debate['umpire']" style="margin-top:.75rem" onblur="checkuserexists(this.value)"></mdui-text-field>
	<mdui-text-field name="affirmpoint" id="affirmpoint" variant="outlined" rows="3" autosize min-rows="3" max-rows="8" label="{lang debate_square_point}" value="$debate['affirmpoint']" style="margin-top:.75rem"></mdui-text-field>
	<mdui-text-field name="negapoint" id="negapoint" variant="outlined" rows="3" autosize min-rows="3" max-rows="8" label="{lang debate_opponent_point}" value="$debate['negapoint']" style="margin-top:.75rem"></mdui-text-field>
	<!--{hook/post_debate_extra}-->
</mdui-card>

<script>
// 裁判用户名是否存在由后端判定，返回的是一段带提示文案的 ajax 响应，直接弹出来
function checkuserexists(username) {
	if (!username) return;
	fetch('forum.php?mod=ajax&inajax=1&action=checkuserexists&username=' + encodeURIComponent(username), {
		credentials: 'same-origin'
	}).then(function (r) {
		return r.text();
	}).then(function (s) {
		// 响应包在 CDATA 里，取出纯文本即可
		var m = s.match(/<!\[CDATA\[([\s\S]*?)\]\]>/);
		var msg = (m ? m[1] : s).replace(/<[^>]*>/g, '').trim();
		msg && mduiTip(msg);
	});
}

// 正反方观点缺一个后端都会拒，提交前先拦。
// mdui-text-field 是自定义元素，取不到 form.xxx，只能按 id 拿
document.getElementById('postsubmit').addEventListener('click', function (e) {
	var tips = { affirmpoint: '{lang post_debate_message_1}', negapoint: '{lang post_debate_message_2}' };
	for (var id in tips) {
		if (!String(document.getElementById(id).value).trim()) {
			mduiTip(tips[id]);
			e.stopImmediatePropagation();
			return;
		}
	}
}, true);
</script>
