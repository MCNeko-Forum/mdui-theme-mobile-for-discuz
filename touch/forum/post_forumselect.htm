<!--{template common/header}-->

<mdui-top-app-bar>
	<mdui-button-icon icon="arrow_back" onclick="history.back()"></mdui-button-icon>
	<mdui-top-app-bar-title>{lang send_posts}</mdui-top-app-bar-title>
	<div style="flex-grow:1"></div>
</mdui-top-app-bar>

<div style="padding:1rem 1rem 160px">
	<mdui-card variant="outlined" style="display:block;padding:.75rem 0 0">
		<div style="padding:0 1rem .5rem;font-size:.875rem;opacity:.65">选择要发布主题的版块</div>
		<div class="mdui-forum-columns">
			<div class="mdui-forum-column">
				<div class="mdui-forum-column-title">分区</div>
				<mdui-list id="block_group"></mdui-list>
			</div>
			<div class="mdui-forum-column">
				<div class="mdui-forum-column-title">版块</div>
				<mdui-list id="block_forum"></mdui-list>
			</div>
			<div class="mdui-forum-column">
				<div class="mdui-forum-column-title">子版块</div>
				<mdui-list id="block_subforum"></mdui-list>
			</div>
		</div>
	</mdui-card>

	<!-- 保留后端生成的三级版块数据，供前端级联显示。 -->
	<div style="display:none">
		<ul id="fs_group">$grouplist</ul>
		<ul id="fs_forum_common">$commonlist</ul>
		<!--{loop $forumlist $forumid $forum}-->
			<ul id="fs_forum_$forumid">$forum</ul>
		<!--{/loop}-->
		<!--{loop $subforumlist $forumid $forum}-->
			<ul id="fs_subforum_$forumid">$forum</ul>
		<!--{/loop}-->
	</div>

	<!--{if $_G['group']['allowpost'] || !$_G['uid']}-->
		<!-- 固定在底部导航栏上方，版块列表再长也不用滑动就能点发帖 -->
		<mdui-button id="postbtn" variant="filled" disabled class="mdui-forum-postbtn">{lang send_posts}</mdui-button>
	<!--{/if}-->
</div>

<style>
.mdui-forum-columns {
	display:grid;
	grid-template-columns:repeat(3,minmax(0,1fr));
	gap:.5rem;
	overflow-x:auto;
}
.mdui-forum-column {
	min-width:0;
	background:var(--mdui-color-surface-container-low);
	border-radius:.75rem;
	overflow:hidden;
}
.mdui-forum-column-title {
	padding:.75rem .75rem .25rem;
	font-size:.75rem;
	opacity:.6;
}
.mdui-forum-column mdui-list {
	padding:.25rem;
	/* 列表在列内部滚动，页面整体不被撑长 */
	max-height:calc(100vh - 300px);
	min-height:120px;
	overflow-y:auto;
}
.mdui-forum-column mdui-list-item {
	--shape-corner: .5rem;
	font-size:.8125rem;
	min-height:44px;
}
/* 固定在底栏（80px）上方 */
.mdui-forum-postbtn {
	position:fixed;
	left:1rem;
	right:1rem;
	bottom:96px;
	width:auto;
	z-index:99;
}
</style>

<script type="text/javascript" reload="1">
var lastSwitchObj = null;
var selectfid = 0;
var switchforum = '';
var switchsubforum = '';
var specialQuery = <!--{if $special}-->'&special=$special'<!--{else}-->''<!--{/if}-->;

function forumItems(id) {
	var source = document.getElementById(id);
	return source ? source.getElementsByTagName('LI') : [];
}

function renderForumList(block, items, level) {
	var target = document.getElementById('block_' + block);
	target.innerHTML = '';
	for (var i = 0; i < items.length; i++) {
		var fid = items[i].getAttribute('fid');
		if (!fid) continue;
		var item = document.createElement('mdui-list-item');
		item.setAttribute('rounded', '');
		item.setAttribute('data-fid', fid);
		item.setAttribute('headline', items[i].textContent || items[i].innerHTML);
		item.innerHTML = '<mdui-icon slot="icon" name="' + (level === 1 ? 'folder' : 'forum') + '"></mdui-icon>';
		item.addEventListener('click', (function (node, currentLevel, currentFid) {
			return function () { switchforums(node, currentLevel, currentFid); };
		})(item, level, fid));
		item.addEventListener('dblclick', (function (currentLevel, currentFid) {
			return function () { locationforums(currentLevel, currentFid); };
		})(level, fid));
		target.appendChild(item);
	}
}

function setActive(obj) {
	if (lastSwitchObj) lastSwitchObj.removeAttribute('active');
	obj && obj.setAttribute('active', '');
	lastSwitchObj = obj;
}

function setPostEnabled(enabled) {
	var button = document.getElementById('postbtn');
	if (!button) return;
	button.disabled = !enabled;
}

function switchforums(obj, block, fid) {
	setActive(obj);
	if (block === 1) {
		renderForumList('forum', forumItems('fs_forum_' + fid), 2);
		document.getElementById('block_subforum').innerHTML = '';
		selectfid = 0;
		switchforum = '';
		switchsubforum = '';
		setPostEnabled(false);
	} else if (block === 2) {
		selectfid = fid;
		renderForumList('subforum', forumItems('fs_subforum_' + fid), 3);
		switchforum = obj.getAttribute('headline') || '';
		switchsubforum = '';
		setPostEnabled(true);
	} else {
		selectfid = fid;
		switchsubforum = obj.getAttribute('headline') || '';
		setPostEnabled(true);
	}
}

function locationforums(block, fid) {
	location.href = block === 1 ? 'forum.php?gid=' + fid : 'forum.php?mod=forumdisplay&fid=' + fid;
}

(function () {
	var groupItems = forumItems('fs_group');
	var groupTarget = document.getElementById('block_group');
	var common = null;
	<!--{if $commonfids}-->
	common = document.createElement('mdui-list-item');
	common.setAttribute('rounded', '');
	common.setAttribute('headline', '{lang nav_forum_frequently}');
	common.innerHTML = '<mdui-icon slot="icon" name="history"></mdui-icon>';
	common.addEventListener('click', function () { switchforums(common, 1, 'common'); });
	groupTarget.appendChild(common);
	<!--{/if}-->
	for (var i = 0; i < groupItems.length; i++) {
		var fid = groupItems[i].getAttribute('fid');
		if (!document.getElementById('fs_forum_' + fid)) continue;
		var item = document.createElement('mdui-list-item');
		item.setAttribute('rounded', '');
		item.setAttribute('data-fid', fid);
		item.setAttribute('headline', groupItems[i].textContent || groupItems[i].innerHTML);
		item.innerHTML = '<mdui-icon slot="icon" name="folder_open"></mdui-icon>';
		item.addEventListener('click', (function (node, currentFid) {
			return function () { switchforums(node, 1, currentFid); };
		})(item, fid));
		item.addEventListener('dblclick', (function (currentFid) {
			return function () { locationforums(1, currentFid); };
		})(fid));
		groupTarget.appendChild(item);
	}
	if (common) {
		switchforums(common, 1, 'common');
	} else if (groupTarget.querySelector('mdui-list-item')) {
		switchforums(groupTarget.querySelector('mdui-list-item'), 1, groupItems[0].getAttribute('fid'));
	}

	var button = document.getElementById('postbtn');
	button && button.addEventListener('click', function () {
		if (!selectfid) return;
		window.location.href = 'forum.php?mod=post&action=newthread&fid=' + selectfid + specialQuery;
	});
})();
</script>

<!--{template common/footer}-->
