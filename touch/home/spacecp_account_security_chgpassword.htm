<!--{template common/header}-->
<!--{subtemplate home/spacecp_header}-->

<mdui-card id="neko_acct_box" variant="filled" style="display:block;padding:1rem">
	<div style="font-size:.9375rem;margin-bottom:1rem">{lang chgpassword_title}</div>
	<form method="post" autocomplete="off" action="home.php?mod=spacecp&ac=account&op=verify&method=$method&idstring=$idstring&sign=$sign&formhash={FORMHASH}">
		<input type="hidden" name="submit" value="true">
		<input type="hidden" name="formhash" value="{FORMHASH}">
		<!--{if $_G['setting']['pwlength']}--><div style="margin-bottom:.75rem;font-size:.8125rem;color:rgb(var(--mdui-color-on-surface-variant))">密码要求：最少 {$_G['setting']['pwlength']} 个字符</div><!--{/if}-->
		<mdui-text-field name="newpassword" type="password" label="{lang newpassword}" toggle-password<!--{if $_G['setting']['pwlength']}--> minlength="{$_G['setting']['pwlength']}"<!--{/if}--> required style="margin-bottom:1rem"></mdui-text-field>
		<mdui-text-field name="renewpassword" type="password" label="{lang renewpassword}" toggle-password required style="margin-bottom:1rem"></mdui-text-field>
		<mdui-button type="submit" variant="filled" full-width>{lang action_account_security_submit}</mdui-button>
	</form>
</mdui-card>
</div>
<!--{template common/footer}-->
