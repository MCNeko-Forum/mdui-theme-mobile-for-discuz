<!--{if $list}-->
	<div style="display:grid;gap:.625rem">
		<!--{loop $list $value}-->
			<!--{if $value['uid']}-->
				<div style="$value['style'];display:flex;gap:.5rem;align-items:flex-start">
					<mdui-avatar src="<!--{avatar($value['uid'], 'small', true)}-->" style="width:28px;height:28px;flex:0 0 auto"></mdui-avatar>
					<div style="min-width:0;flex:1;padding:.5rem .625rem;background:rgb(var(--mdui-color-surface-container-high));border-radius:.5rem">
						<div style="font-size:.875rem"><a href="home.php?mod=space&uid=$value['uid']&do=profile" style="color:rgb(var(--mdui-color-primary));text-decoration:none;font-weight:500">$value['username']</a>：$value['message']</div>
						<div style="display:flex;align-items:center;margin-top:.25rem;color:rgb(var(--mdui-color-on-surface-variant));font-size:.75rem"><span><!--{date($value['dateline'], 'n-j H:i')}--></span>
							<!--{if helper_access::check_module('doing') && $_G['uid']}--><mdui-button variant="text" style="margin-left:auto;min-width:auto" onclick="document.getElementById('mdui_docomment_reply_$value['id']).open=true">{lang reply}</mdui-button><!--{/if}-->
							<!--{if $_G['uid'] && ($value['uid'] == $_G['uid'] || $dv['uid'] == $_G['uid'] || checkperm('managedoing'))}--><mdui-button variant="text" style="min-width:auto" onclick="document.getElementById('mdui_docomment_delete_$value['id']).open=true">{lang delete}</mdui-button><!--{/if}-->
						</div>
						<!--{if helper_access::check_module('doing') && $_G['uid']}-->
						<mdui-dialog id="mdui_docomment_reply_$value['id']" close-on-esc close-on-overlay-click>
							<div slot="headline">{lang reply}</div>
							<form method="post" action="home.php?mod=spacecp&ac=doing&op=docomment&doid=$value['doid']&id=$value['id']">
								<div slot="description" style="display:flex;align-items:end;gap:.25rem"><mdui-text-field id="mdui_docomment_reply_message_$value['id']" name="message" label="{lang reply}" rows="4" maxlength="200" counter required style="flex:1"></mdui-text-field><mdui-button-icon icon="sentiment_satisfied" type="button" onclick="mduiDoingSmile('mdui_docomment_reply_message_$value['id']')" title="{lang smilies}"></mdui-button-icon></div>
								<input type="hidden" name="commentsubmit" value="true"><input type="hidden" name="formhash" value="{FORMHASH}">
								<mdui-button slot="action" type="button" variant="text" onclick="document.getElementById('mdui_docomment_reply_$value['id']).open=false">{lang cancel}</mdui-button>
								<mdui-button slot="action" type="submit" variant="text">{lang reply}</mdui-button>
							</form>
						</mdui-dialog>
						<!--{/if}-->
					</div>
				</div>
				<!--{if $_G['uid'] && ($value['uid'] == $_G['uid'] || $dv['uid'] == $_G['uid'] || checkperm('managedoing'))}-->
				<mdui-dialog id="mdui_docomment_delete_$value['id']" close-on-esc close-on-overlay-click>
					<div slot="headline">{lang delete}</div><div slot="description">{lang determine_delete_doing}</div>
					<form method="post" action="home.php?mod=spacecp&ac=doing&op=delete&doid=$value['doid']&id=$value['id']">
						<input type="hidden" name="referer" value="$theurl"><input type="hidden" name="formhash" value="{FORMHASH}"><input type="hidden" name="deletesubmit" value="true">
						<mdui-button slot="action" type="button" variant="text" onclick="document.getElementById('mdui_docomment_delete_$value['id']').open=false">{lang cancel}</mdui-button>
						<mdui-button slot="action" type="submit" variant="text">{lang determine}</mdui-button>
					</form>
				</mdui-dialog>
				<!--{/if}-->
			<!--{/if}-->
		<!--{/loop}-->
	</div>
<!--{/if}-->
