<!--{template common/header}-->
<mdui-dialog open>
	<div slot="headline"><!--{if $_GET['op'] == 'delete'}-->{lang delete}<!--{else}-->{lang myfavorite}<!--{/if}--></div>
	<!--{if $_GET['op'] == 'delete'}-->
	<div slot="description">{lang delete_favorite_message}</div>
	<form id="favoriteform_{$favid}" name="favoriteform_{$favid}" method="post" autocomplete="off" action="home.php?mod=spacecp&ac=favorite&op=delete&favid=$favid&type=$_GET['type']&mobile=2">
		<input type="hidden" name="referer" value="{eval echo dreferer();}" />
		<input type="hidden" name="deletesubmit" value="true" />
		<input type="hidden" name="formhash" value="{FORMHASH}" />
		<mdui-button slot="action" variant="text" type="button" onclick="history.back()">{lang cancel}</mdui-button>
		<mdui-button slot="action" variant="text" type="submit" name="deletesubmitbtn" value="{lang determine}">{lang determine}</mdui-button>
	</form>
	<!--{else}-->
	<form method="post" autocomplete="off" id="favoriteform_{$id}" name="favoriteform_{$id}" action="home.php?mod=spacecp&ac=favorite&type=$type&id=$id&spaceuid=$spaceuid&mobile=2">
		<mdui-text-field id="general_{$id}" name="description" value="<!--{if $description}-->$description<!--{else}-->{lang favorite_description_default}<!--{/if}-->" label="{lang favorite_description_default}" textarea rows="3"></mdui-text-field>
		<input type="hidden" name="favoritesubmit" value="true" />
		<input type="hidden" name="referer" value="{eval echo dreferer();}" />
		<input type="hidden" name="formhash" value="{FORMHASH}" />
		<mdui-button slot="action" variant="text" type="button" onclick="history.back()">{lang cancel}</mdui-button>
		<mdui-button slot="action" variant="text" type="submit" name="favoritesubmit_btn" id="favoritesubmit_btn" value="{lang determine}">{lang determine}</mdui-button>
	</form>
	<!--{/if}-->
</mdui-dialog>
<!--{template common/footer}-->
