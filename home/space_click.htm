<!--{if $clicks}-->
<div class="mdui-click-bar" id="mdui_click_bar">
	<!--{loop $clicks $key $value}-->
	<button type="button" class="mdui-click-item" data-clickid="$key" data-click-url="home.php?mod=spacecp&ac=click&op=add&clickid=$key&idtype=$idtype&id=$id&hash=$hash">
		<img src="$value['icon']" alt="$value['name']">
		<span>$value['name']</span>
		<em class="mdui-click-num"><!--{if $value['clicknum']}-->$value['clicknum']<!--{else}-->0<!--{/if}--></em>
	</button>
	<!--{/loop}-->
</div>
<!--{if $clickuserlist}-->
<div class="mdui-click-users">
	<!--{loop $clickuserlist $value}-->
	<!--{if $value['username']}-->
	<a href="home.php?mod=space&uid=$value['uid']" title="$value['username'] · $value['clickname']"><mdui-avatar src="<!--{avatar($value['uid'], 'small', true)}-->"></mdui-avatar></a>
	<!--{else}-->
	<mdui-avatar title="{lang anonymity}"></mdui-avatar>
	<!--{/if}-->
	<!--{/loop}-->
</div>
<!--{/if}-->
<script>
(function () {
	var bar = document.getElementById('mdui_click_bar');
	if (!bar) return;
	bar.addEventListener('click', function (e) {
		var btn = e.target.closest && e.target.closest('.mdui-click-item');
		if (!btn) return;
		e.preventDefault();
		e.stopPropagation();
		if (btn.disabled) return;
		<!--{if !$_G['uid']}-->
		mduiTip('请先登录后再表态', true);
		setTimeout(function () { location.href = 'member.php?mod=logging&action=login'; }, 800);
		return;
		<!--{/if}-->
		btn.disabled = true;
		var url = btn.getAttribute('data-click-url') + '&inajax=1&ajaxdata=json&mobile=2';
		fetch(url, { credentials: 'same-origin' }).then(function (r) {
			return r.text();
		}).then(function (t) {
			var j = null;
			try { j = JSON.parse(t); } catch (err) {}
			if (!j || !j.message) {
				var box = document.createElement('div');
				var m = String(t).match(/<!\[CDATA\[([\s\S]*)\]\]>/);
				box.innerHTML = m ? m[1] : t;
				var txt = ((box.querySelector('#messagetext') || box).textContent || '').replace(/\s+/g, ' ').trim();
				mduiTip(txt || '表态失败', true);
				btn.disabled = false;
				return;
			}
			var ok = !!(j.data && j.data.id);
			mduiTip(j.message, !ok);
			if (ok) {
				var num = btn.querySelector('.mdui-click-num');
				num.textContent = (parseInt(num.textContent, 10) || 0) + 1;
				bar.querySelectorAll('.mdui-click-item').forEach(function (el) { el.disabled = true; });
			} else {
				btn.disabled = false;
			}
		}).catch(function () {
			mduiTip('{lang networkerror}', true);
			btn.disabled = false;
		});
	}, true);
})();
</script>
<!--{/if}-->
