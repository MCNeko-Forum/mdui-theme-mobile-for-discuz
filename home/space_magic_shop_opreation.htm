<!--{template common/header}-->
<mdui-dialog open close-on-esc close-on-overlay-click>
	<div slot="headline">$magic['name']</div>
	<form method="post" action="home.php?mod=magic&action=shop">
		<div slot="description"><div style="display:flex;gap:1rem;align-items:center"><mdui-avatar src="$magic['pic']"></mdui-avatar><div>$magic['description']</div></div>
			<!--{if $operation == 'buy'}--><div style="margin-top:1rem">{lang magics_price}：$magic['price'] {$_G['setting']['extcredits'][$magic['credit']]['title']}</div><mdui-text-field name="magicnum" type="number" value="1" label="{lang magics_num}" required></mdui-text-field><!--{elseif $operation == 'give'}--><mdui-text-field name="tousername" label="{lang magics_target_present}" required></mdui-text-field><mdui-text-field name="magicnum" type="number" value="1" label="{lang magics_num}" required></mdui-text-field><!--{/if}-->
		</div>
		<input type="hidden" name="formhash" value="{FORMHASH}"><input type="hidden" name="operation" value="$operation"><input type="hidden" name="mid" value="$_GET['mid']"><input type="hidden" name="operatesubmit" value="yes">
		<mdui-button slot="action" type="button" variant="text" onclick="history.back()">{lang cancel}</mdui-button><mdui-button slot="action" type="submit" variant="text" name="operatesubmit" value="true"><!--{if $operation == 'buy'}-->{lang magics_operation_buy}<!--{else}-->{lang magics_operation_present}<!--{/if}--></mdui-button>
	</form>
</mdui-dialog>
<!--{template common/footer}-->
