<mdui-card id="neko_acct_box" variant="filled" style="display:block;padding:1rem">
	<div style="font-size:.9375rem;margin-bottom:1rem">{lang action_account_security_verify} · {lang action_account_security_type_password}</div>
	<form method="post" autocomplete="off" action="home.php?mod=spacecp&ac=account&op=verify&method=$method&verify=password&formhash={FORMHASH}">
		<input type="hidden" name="security_submit" value="true">
		<input type="hidden" name="formhash" value="{FORMHASH}">
		<div style="font-size:.875rem;margin-bottom:1rem">{$_G['member']['username']}</div>
		<mdui-text-field name="password" type="password" label="{lang action_account_security_type_password}" toggle-password required style="margin-bottom:1rem"></mdui-text-field>
		<mdui-button type="submit" variant="filled" full-width>{lang action_account_security_submit}</mdui-button>
	</form>
</mdui-card>
</div>
