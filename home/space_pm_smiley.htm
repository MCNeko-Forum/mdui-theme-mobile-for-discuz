<!-- 私信表情面板：用论坛表情（smilies_type / smilies_array，与论坛编辑器同一套数据）。
     插入的是表情原码（如 :)），发送时由 spacecp/pm.php 的 smilies 缓存替换成 [img]。
     私信消息渲染走 UCenter 的 uccode，只认 [img]，解析不了家园那套 comcom 标记，
     所以这里不能复用到 space_doing_smiley 的 comcom 面板。 -->
<style>
/* mdui-tabs 自身不撑高，必须显式给高度，否则面板高度为 0 什么都看不到 */
#mdui_pm_smiley_tabs { display: block; height: 40vh; }
/* 只给激活面板限高滚动，否则各分类面板会同时撑开 */
#mdui_pm_smiley_tabs mdui-tab-panel[active] { display: block; height: 100%; overflow-y: auto; padding: .5rem; }
/* 表情原图尺寸不一（20~50px），统一压到 28px 免得撑破网格 */
#mdui_pm_smiley_tabs img { width: 28px; height: 28px; object-fit: contain; cursor: pointer; }
</style>
<mdui-dialog id="mdui_pm_smiley" close-on-esc close-on-overlay-click headline="{lang insert_emoticons}">
	<mdui-tabs id="mdui_pm_smiley_tabs" full-width></mdui-tabs>
</mdui-dialog>
<script src="data/cache/common_smilies_var.js?{VERHASH}" charset="{CHARSET}"></script>
<script>
(function () {
	var target;
	window.mduiPmSmile = function (field) {
		target = typeof field === 'string' ? document.getElementById(field) : field;
		if (target) document.getElementById('mdui_pm_smiley').open = true;
	};

	var tabs = document.getElementById('mdui_pm_smiley_tabs');
	if (!tabs || typeof smilies_type != 'object' || typeof smilies_array != 'object') return;
	// smilies_type 的键是 _1/_2，而 smilies_array 用的是数字 1/2
	var bars = '', panels = '', first = '';
	for (var key in smilies_type) {
		var id = key.replace('_', ''), dir = smilies_type[key][1];
		first || (first = 'sm' + id);
		bars += '<mdui-tab value="sm' + id + '">' + smilies_type[key][0] + '</mdui-tab>';
		panels += '<mdui-tab-panel slot="panel" value="sm' + id + '"><div class="mdui-wall-faces">';
		for (var page in smilies_array[id]) {
			for (var n = 0; n < smilies_array[id][page].length; n++) {
				var sm = smilies_array[id][page][n];
				panels += '<img src="static/image/smiley/' + dir + '/' + sm[2] + '" data-code="' + sm[1].replace(/"/g, '&quot;') + '">';
			}
		}
		panels += '</div></mdui-tab-panel>';
	}
	tabs.innerHTML = bars + panels;
	tabs.value = first;
	tabs.addEventListener('click', function (event) {
		var code = event.target.dataset && event.target.dataset.code;
		if (!code || !target) return;
		target.value += code;
		target.focus();
		document.getElementById('mdui_pm_smiley').open = false;
	});
})();
</script>
