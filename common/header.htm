	<!-- 折叠组件兼容：spoiler.js 在 head 中执行时按钮尚未渲染，改用事件委托按相邻关系开关内容，并拦截原脚本避免重复切换 -->
	<script>
	document.addEventListener('click', function(e) {
		var btn = e.target.closest ? e.target.closest('.toggleButton') : null;
		if(!btn) return;
		var c = btn.nextElementSibling;
		if(!c || !c.classList || !c.classList.contains('content')) {
			c = btn.parentElement ? btn.parentElement.querySelector(':scope > .content') : null;
		}
		if(c) {
			c.style.display = (window.getComputedStyle(c).display === 'none') ? 'block' : 'none';
			e.stopPropagation();
		}
	}, true);
	</script>
