<style>
html, body { height:100%; margin:0; background:#111; }
.mdui-album { position:fixed; inset:0; background:#111; color:#fff; overflow:hidden; }
.mdui-album-bar { position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; gap:.5rem; height:3.25rem; padding:0 .5rem; background:rgba(0,0,0,.72); }
.mdui-album-bar a { color:#fff; text-decoration:none; }
.mdui-album-track { height:100%; display:flex; transition:transform .25s ease; }
.mdui-album-item { flex:0 0 100%; height:100%; display:flex; align-items:center; justify-content:center; }
.mdui-album-item > span { width:100%; height:100%; }
.mdui-album-item img { max-width:100%; max-height:100%; object-fit:contain; }
</style>
<div class="mdui-album">
	<div class="mdui-album-bar">
		<mdui-button-icon icon="arrow_back" href="forum.php?mod=viewthread&tid=$_G['tid']&page=$_G['page']" style="color:#fff"></mdui-button-icon>
		<span style="flex:1"></span>
		<span id="mdui_album_num"><!--{eval echo $curaidkey + 1;}--> / $count</span>
	</div>
	<div class="mdui-album-track" id="mdui_album_track">
		<!--{loop $imglist['url'] $key $imgurl}-->
		<div class="mdui-album-item">
			<img <!--{if $curaidkey == $key}-->src="$imgurl"<!--{/if}--> data-src="$imgurl" alt="">
		</div>
		<!--{/loop}-->
	</div>
</div>
<script>
(function () {
	var track = document.getElementById('mdui_album_track');
	var num = document.getElementById('mdui_album_num');
	var imgs = track.querySelectorAll('img');
	var cur = $curaidkey;
	var count = $count;
	function show(i) {
		cur = Math.max(0, Math.min(count - 1, i));
		var img = imgs[cur];
		if (img && !img.getAttribute('src')) img.src = img.getAttribute('data-src');
		track.style.transform = 'translateX(-' + (cur * 100) + '%)';
		num.textContent = (cur + 1) + ' / ' + count;
	}
	var x = 0;
	track.addEventListener('touchstart', function (e) { x = e.touches[0].clientX; }, {passive: true});
	track.addEventListener('touchend', function (e) {
		var dx = e.changedTouches[0].clientX - x;
		if (dx < -40) show(cur + 1);
		else if (dx > 40) show(cur - 1);
	});
	show(cur);
})();
</script>
